# cPanel Git Version Control deployment.
#
# Runs when you press "Deploy HEAD Commit" in cPanel → Git Version Control,
# after pulling from GitHub. It copies the working tree into the Node.js
# application root, installs dependencies and rebuilds the site.
#
# ---------------------------------------------------------------------------
# Configured for cPanel user "highleap", Node 24, app root ~/farmyuga.
# If you ever change the Node version in Setup Node.js App, update the version
# number in NODEENV below to match the `source ...` command cPanel shows there.
# ---------------------------------------------------------------------------
#
# Note: cPanel's deploy shell does not have the Node.js virtualenv on PATH by
# default, which is why each build step sources the app's activation script
# first. cPanel prints that exact `source ...` command at the top of the
# Setup Node.js App page for your application — if the path below does not
# match it, copy theirs over these lines.

---
deployment:
  tasks:
    - export DEPLOYPATH=/home/highleap/farmyuga
    - export NODEENV=/home/highleap/nodevenv/farmyuga/24/bin/activate

    # Copy the repo into the app root. `git archive` exports only tracked
    # files — no .git, no node_modules, no local junk — and this server has
    # no rsync, so tar does the extraction. Existing node_modules, .next and
    # tmp/ in the destination are untouched, which keeps npm incremental and
    # preserves Passenger's restart trigger.
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/bash -lc "cd $DEPLOYPATH/../repositories/farmyuga 2>/dev/null || cd \"$PWD\"; git archive HEAD | tar -x -C $DEPLOYPATH"

    # Install exactly what package-lock.json specifies, then build.
    #
    # --include=dev is REQUIRED. cPanel's activate script sets
    # NODE_ENV=production, which makes npm skip devDependencies — and the
    # build needs @tailwindcss/postcss, tailwindcss and typescript, all of
    # which live there. Without this flag the build dies with
    # "Cannot find module '@tailwindcss/postcss'".
    - /bin/bash -lc "source $NODEENV && cd $DEPLOYPATH && (npm ci --include=dev --no-audit --no-fund || npm install --include=dev --no-audit --no-fund)"
    - /bin/bash -lc "source $NODEENV && cd $DEPLOYPATH && NODE_ENV=production npm run build"

    # Passenger reloads the app when this file's timestamp changes.
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
